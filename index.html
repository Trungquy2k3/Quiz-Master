<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Master - Điền từ</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo">QUIZ MASTER</div>
        <div><a href="admin.html" style="color:var(--dark); text-decoration:none; font-weight:600;">Admin</a></div>
    </header>
    <div class="container">
        <div class="glass-card">
            <h2>BÀI KIỂM TRA ĐIỀN TỪ</h2>
            <p style="text-align:center; margin-bottom:20px; color:#475569;">Hệ thống sẽ chọn ngẫu nhiên 1 trong các đề để kiểm tra.</p>
            <form id="infoForm">
                <div class="form-group"><label>Họ và tên *</label><input type="text" id="fullname" class="form-control" required></div>
                <div class="form-group"><label>Tên công ty *</label><input type="text" id="companyName" class="form-control" required></div>
                <div class="form-group"><label>Email *</label><input type="email" id="email" class="form-control" required></div>
                <button type="submit" class="btn" style="margin-top: 10px;">BẮT ĐẦU LÀM BÀI 🚀</button>
            </form>
        </div>
    </div>
    <script src="js/index.js"></script>
</body>
</html>
