<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kết quả - Quiz Master</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div class="bg-grid"></div>
    <header><div class="logo">QUIZ MASTER</div></header>
    <div class="container">
        <div class="glass-card" style="text-align: center;">
            <h1 style="font-size:34px;font-weight:800;margin-bottom:8px;">🎉 Hoàn thành!</h1>
            <h2 id="studentInfo" style="color:var(--muted);font-weight:500;font-size:16px;margin-bottom:28px;"></h2>
            <div class="ring" id="ring"><div id="scoreDisplay">0/100</div></div><div class="verdict" id="verdict"></div>
            <div class="stats-grid">
                <div class="stat-card"><h3>Câu đúng</h3><div class="value" id="correctVal" style="color: var(--success)">0</div></div>
                <div class="stat-card"><h3>Câu sai</h3><div class="value" id="wrongVal" style="color: var(--danger)">0</div></div>
                <div class="stat-card"><h3>Thời gian</h3><div class="value" id="timeVal" style="color: #f59e0b">00:00</div></div>
            </div>
            <button onclick="window.location.href='index.html'" class="btn" style="margin-top:20px;">VỀ TRANG CHỦ</button>
        </div>
    </div>
    <script src="js/result.js"></script>
</body>
</html>
