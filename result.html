<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kết quả - Quiz Master</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <header><div class="logo">QUIZ MASTER</div></header>
    <div class="container">
        <div class="glass-card" style="text-align: center;">
            <h1 style="font-size: 40px; margin-bottom: 10px;">🎉 HOÀN THÀNH!</h1>
            <h2 id="studentInfo" style="color: #475569; font-weight: 500; font-size: 18px; margin-bottom: 30px;"></h2>
            <div style="font-size: 60px; font-weight: 700; color: var(--primary); margin-bottom: 20px;" id="scoreDisplay">0/100</div>
            <div class="stats-grid">
                <div class="stat-card"><h3>Số câu đúng</h3><div class="value" id="correctVal" style="color: var(--success)">0</div></div>
                <div class="stat-card"><h3>Số câu sai</h3><div class="value" id="wrongVal" style="color: var(--danger)">0</div></div>
                <div class="stat-card"><h3>Thời gian</h3><div class="value" id="timeVal" style="color: #f59e0b">00:00</div></div>
            </div>
            <button onclick="window.location.href='index.html'" class="btn" style="margin-top:20px;">VỀ TRANG CHỦ</button>
        </div>
    </div>
    <script src="js/result.js"></script>
</body>
</html>
