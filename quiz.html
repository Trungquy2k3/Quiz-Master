<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đang làm bài - Quiz Master</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div class="bg-grid"></div>
    <header>
        <div class="logo">QUIZ MASTER</div>
        <div style="display:flex; align-items:center; gap:16px;">
            <label class="sound">
                <input type="checkbox" id="soundToggle" checked> 🔊 Âm thanh
            </label>
            <div id="timer">⏱ 00:00</div>
        </div>
    </header>
    <div class="container">
        <div class="glass-card" id="quizCard">
            <div class="quiz-header">
                <span id="questionCount">CÂU 01 / 20</span>
                <span id="progressText">5%</span>
            </div>
            <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
            <div id="questionContainer">
                <div class="question-text" id="questionText">Loading...</div>
                <input type="text" id="answerInput" class="form-control input-answer" placeholder="Nhập từ còn thiếu..." autocomplete="off">
                <button id="checkBtn" class="btn">KIỂM TRA ✓</button>
                <div id="feedbackText" class="feedback"></div>
            </div>
        </div>
    </div>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/questions.js"></script>
    <script src="js/quiz.js"></script>
</body>
</html>
